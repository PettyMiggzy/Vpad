<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050805" />
  <title>Vyre Bad Lands</title>
  <style>
    :root { --lime: #b6ff00; --bg: #050805; --panel: rgba(10, 16, 8, .92); --line: #27391a; --muted: #93a58a; --gold: #ffd24a; --red: #ff5a5a;
      --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #e8f5da; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; touch-action: none; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, #0b1608 0%, #050805 70%); z-index: 5; }
    #boot img { width: min(78vw, 420px); height: auto; filter: drop-shadow(0 0 28px rgba(182,255,0,.35)); }
    #boot .meter { width: min(60vw, 280px); height: 5px; border-radius: 3px; background: #16240f; overflow: hidden; }
    #boot .meter i { display: block; width: 4%; height: 100%; background: linear-gradient(90deg, #6fb800, var(--lime)); box-shadow: 0 0 14px var(--lime); transition: width .25s ease; }
    #boot span { color: var(--muted); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    #ui > * { pointer-events: auto; }
    .vignette { position: fixed; inset: 0; pointer-events: none !important; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); z-index: 1; }
    .top { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + var(--safe-t)) 14px 10px; display: flex; gap: 10px; align-items: center; pointer-events: none !important;
      background: linear-gradient(to bottom, rgba(5,8,5,.92) 0%, rgba(5,8,5,.6) 55%, rgba(5,8,5,0) 100%); padding-bottom: 26px; }
    .top > * { pointer-events: auto; }
    .brand { display: flex; flex-direction: column; line-height: 1.05; }
    .brand b { color: var(--lime); font-size: 17px; letter-spacing: .09em; font-weight: 900; text-shadow: 0 0 14px rgba(182,255,0,.5); }
    .brand span { color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .pill { margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--lime); color: var(--lime); background: rgba(182,255,0,.08); white-space: nowrap; }
    .pill.preview { border-color: var(--gold); color: var(--gold); background: rgba(255,210,74,.08); }
    .rail { position: fixed; right: 12px; top: calc(70px + var(--safe-t)); display: flex; flex-direction: column; gap: 8px; }
    .rail button, .fab { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--lime); font-size: 22px; font-weight: 700; cursor: pointer; backdrop-filter: blur(6px); }
    .rail button:active, .fab:active { transform: scale(.94); }
    .fab.legend { position: fixed; left: 12px; bottom: calc(14px + var(--safe-b)); }
    .legend-pop { position: fixed; left: 12px; bottom: calc(68px + var(--safe-b)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.7; display: none; backdrop-filter: blur(6px); }
    .legend-pop.on { display: block; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-bottom: none; border-radius: 22px 22px 0 0;
      padding: 14px 16px calc(16px + var(--safe-b)); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); backdrop-filter: blur(10px); box-shadow: 0 -10px 40px rgba(0,0,0,.6); z-index: 3; }
    .sheet { visibility: hidden; } .sheet.on { transform: none; visibility: visible; } .sheet { max-height: 86vh; overflow-y: auto; touch-action: pan-y; }
    .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #35502a; margin: 0 auto 12px; }
    .sheet h2 { margin: 0 0 2px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
    .sheet .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat { background: rgba(182,255,0,.05); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; }
    .stat b { display: block; font-size: 17px; color: #fff; }
    .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .row { display: flex; gap: 10px; }
    .btn { flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: #e8f5da; font-size: 15px; font-weight: 800; cursor: pointer; padding: 0 14px; }
    .btn.primary { background: var(--lime); border-color: var(--lime); color: #071000; box-shadow: 0 0 22px rgba(182,255,0,.28); }
    .btn.danger { background: rgba(255,90,90,.12); border-color: var(--red); color: #ffb0b0; }
    .btn:active { transform: scale(.98); }
    .btn[disabled] { opacity: .6; border-style: dashed; color: #9fb393; }
    .tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; margin-left: 6px; }
    .tag.war { background: rgba(255,90,90,.15); color: #ff8a8a; border: 1px solid var(--red); }
    .tag.prem { background: rgba(182,255,0,.12); color: var(--lime); border: 1px solid var(--lime); }
    .tag.gold { background: rgba(255,210,74,.12); color: var(--gold); border: 1px solid var(--gold); }
    @media (min-width: 900px) { .brand b { font-size: 21px; } .sheet { left: auto; right: 18px; bottom: 18px; margin: 0; border-radius: 22px; border-bottom: 1px solid var(--line); width: 400px; } }

    .basetop .back { min-width: 64px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: #fff; font-size: 16px; font-weight: 800; }
    .dock { position: fixed; left: 0; right: 0; bottom: 0; height: 58%; max-height: 560px; background: var(--panel); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; backdrop-filter: blur(10px); display: flex; flex-direction: column; box-shadow: 0 -12px 40px rgba(0,0,0,.6); }
    .tabs { display: flex; gap: 6px; padding: 10px 12px 0; }
    .tabs button { flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 12px 12px 0 0; border-bottom: none; background: rgba(255,255,255,.03); color: var(--muted); font-size: 15px; font-weight: 800; }
    .tabs button.on { background: rgba(182,255,0,.12); color: var(--lime); border-color: var(--lime); }
    .tabbody { flex: 1; overflow-y: auto; padding: 12px 14px calc(16px + var(--safe-b)); touch-action: pan-y; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--line); }
    .card { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; margin-bottom: 8px; }
    .card img { width: 62px; height: 52px; object-fit: contain; flex: none; }
    .card .grow { flex: 1; min-width: 0; } .card b { display: block; font-size: 15px; } .card small { color: var(--muted); font-size: 12px; } .cnt { color: var(--lime); }
    .btn.small { flex: none; min-width: 84px; min-height: 44px; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 8px 2px 0; }
    .status { margin-top: 10px; font-size: 13px; color: var(--muted); word-break: break-word; } .status.ok { color: var(--lime); } .status.bad { color: var(--red); } .status.wait { color: var(--gold); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .lbl { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
    select { width: 100%; min-height: 48px; border-radius: 12px; background: #0d160a; color: #fff; border: 1px solid var(--line); font-size: 16px; padding: 0 12px; margin-bottom: 12px; }
    .fight { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; text-align: center; font-size: 14px; }
    .fight .bar { height: 12px; border-radius: 6px; background: #3a1414; overflow: hidden; margin-bottom: 8px; } .fight .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--lime), #6fe000); }
    .fight .vs { display: flex; justify-content: space-between; color: var(--muted); } .fight .vs b { color: #fff; font-size: 18px; }
    .fight .win { color: var(--lime); font-weight: 900; margin-top: 6px; letter-spacing: .06em; } .fight .lose { color: var(--red); font-weight: 900; margin-top: 6px; letter-spacing: .06em; }
    .tabbody section[hidden] { display: none; }
    @media (min-width: 900px) { .dock { left: auto; right: 0; top: 0; bottom: 0; height: auto; max-height: none; width: 430px; border-radius: 0; border-top: none; border-left: 1px solid var(--line); padding-top: calc(70px + var(--safe-t)); }
      .basetop { right: 430px; } }

    .battle-top { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + var(--safe-t)) 12px 18px; display: flex; gap: 10px; align-items: center; background: linear-gradient(to bottom, rgba(5,8,5,.92), rgba(5,8,5,0)); pointer-events: none; }
    .battle-top > * { pointer-events: auto; }
    .battle-top .back { min-width: 64px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: #fff; font-size: 15px; font-weight: 800; }
    .battle-top .vs { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .battle-top .side { flex: 1; min-width: 0; } .battle-top .side.r { text-align: right; }
    .battle-top .side b { display: block; font-size: 15px; letter-spacing: .04em; text-shadow: 0 2px 6px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .battle-top .side small { color: var(--muted); font-size: 11px; }
    .battle-top .bar { height: 10px; border-radius: 5px; background: rgba(0,0,0,.6); border: 1px solid var(--line); overflow: hidden; margin: 3px 0; }
    .battle-top .side.r .bar { direction: rtl; }
    .battle-top .bar i { display: block; height: 100%; width: 100%; transition: width .45s ease; border-radius: 5px; box-shadow: 0 0 10px rgba(255,255,255,.25) inset; }
    .battle-top .x { color: #ff5a5a; font-weight: 900; font-size: 13px; letter-spacing: .1em; }
    .banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font-size: clamp(26px, 8vw, 54px); font-weight: 900; letter-spacing: .08em; text-shadow: 0 4px 0 #000, 0 0 30px rgba(0,0,0,.8); opacity: 0; transform: scale(.7); transition: opacity .25s, transform .25s; pointer-events: none !important; text-transform: uppercase; padding: 0 10px; }
    .banner.on { opacity: 1; transform: scale(1); }
    .battle-result { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-bottom: none; border-radius: 22px 22px 0 0; padding: 16px 18px calc(18px + var(--safe-b)); transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); backdrop-filter: blur(10px); box-shadow: 0 -10px 40px rgba(0,0,0,.6); }
    .battle-result { visibility: hidden; } .battle-result.on { transform: none; visibility: visible; }
    .battle-result h3 { margin: 0 0 6px; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; }
    .battle-result p { margin: 0 0 14px; color: #cfe0c4; font-size: 14px; line-height: 1.5; } .battle-result b { color: #fff; }
    @media (min-width: 900px) { .battle-result { left: auto; right: 18px; bottom: 18px; margin: 0; border-radius: 22px; border-bottom: 1px solid var(--line); width: 420px; } }

    .sbx-bar { position: fixed; left: 12px; top: calc(62px + var(--safe-t)); display: flex; gap: 5px; flex-wrap: wrap; max-width: calc(100vw - 76px); pointer-events: none; }
    .sbx-bar .chip, .res .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; font-size: 12px; pointer-events: auto; white-space: nowrap; }
    .chip i { font-style: normal; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; } .chip b { color: #fff; }
    .chip.clk button { border: 1px solid var(--lime); background: rgba(182,255,0,.12); color: var(--lime); border-radius: 999px; font-weight: 800; font-size: 11px; padding: 3px 8px; min-height: 26px; }
    .sbx-rail { position: fixed; left: 12px; top: calc(128px + var(--safe-t)); display: flex; flex-direction: column; gap: 8px; }
    .sbx-rail button { position: relative; width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; backdrop-filter: blur(6px); }
    .sbx-rail b { font-size: 20px; line-height: 1; } .sbx-rail span { font-size: 10px; color: var(--muted); } .sbx-rail button[disabled] { opacity: .4; }
    .sbx-rail em { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--lime); color: #071000; font-style: normal; font-weight: 900; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
    .toasts { position: fixed; left: 0; right: 0; top: calc(112px + var(--safe-t)); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 6; pointer-events: none; padding: 0 12px; }
    .toast { pointer-events: auto; max-width: 520px; background: rgba(10,16,8,.96); border: 1px solid var(--lime); border-radius: 14px; padding: 10px 14px; font-size: 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.6); transition: opacity .6s; }
    .toast.out { opacity: 0; } .toast button { border: 0; background: var(--lime); color: #071000; font-weight: 800; border-radius: 10px; padding: 8px 12px; min-height: 36px; }
    .modal { position: fixed; inset: 0; background: rgba(3,6,3,.88); z-index: 8; display: grid; place-items: center; padding: 14px; overflow-y: auto; touch-action: pan-y; }
    .card.big { display: block; width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
    .card.big .ttl { display: block; width: min(300px, 80%); margin: 0 auto 8px; filter: drop-shadow(0 0 22px rgba(182,255,0,.3)); }
    .card.big .lead { color: #cfe0c4; font-size: 14px; line-height: 1.5; text-align: center; margin: 0 0 12px; }
    .card.big input { width: 100%; min-height: 48px; border-radius: 12px; background: #0d160a; color: #fff; border: 1px solid var(--line); font-size: 18px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 0 12px; margin-bottom: 12px; }
    .picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .picks button { border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 12px; padding: 6px 2px; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .picks button.on { border-color: var(--lime); background: rgba(182,255,0,.12); } .picks img { width: 100%; height: 56px; object-fit: contain; } .picks b { font-size: 12px; } .picks small { font-size: 9px; color: var(--muted); text-align: center; }
    .swatches { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; } .swatches button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; } .swatches button.on { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,.5); }
    .err { color: var(--red); font-size: 13px; min-height: 18px; margin-bottom: 6px; } .card.big .btn { width: 100%; }
    .pickbanner { position: fixed; left: 12px; right: 12px; top: calc(104px + var(--safe-t)); background: var(--panel); border: 1px solid var(--lime); border-radius: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.4; z-index: 3; pointer-events: none; }
    .pickbanner b { display: block; color: var(--lime); font-size: 15px; margin-bottom: 2px; }
    .loglist { max-height: 46vh; overflow-y: auto; margin-bottom: 12px; touch-action: pan-y; }
    .logrow { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.4; } .logrow span { flex: 1; } .logrow small { color: var(--muted); font-size: 11px; white-space: nowrap; } .logrow.raid span { color: #ffc2c2; }
    .nrow { display: flex; gap: 10px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--line); border-radius: 8px; } .nrow.me { background: rgba(182,255,0,.08); } .nrow .nm { font-weight: 800; flex: 1; } .nrow small { color: var(--muted); } .nrow b { color: var(--muted); width: 18px; }
    textarea { width: 100%; min-height: 84px; border-radius: 12px; background: #0d160a; color: #fff; border: 1px solid var(--line); font-size: 14px; padding: 10px; margin-bottom: 8px; font-family: inherit; }
    .seg .btn small { font-weight: 500; color: inherit; opacity: .7; } .seg .btn { line-height: 1.2; padding: 6px; }
    .res { display: flex; gap: 4px; padding: 10px 12px 0; flex-wrap: nowrap; } .res .chip { padding: 4px 8px; font-size: 12px; gap: 4px; flex: 1; justify-content: center; white-space: nowrap; } .res .chip i { font-size: 9px; }
    .card .btn.small { min-width: 58px; padding: 0 8px; font-size: 14px; } .card img { width: 52px; height: 46px; }
    .job { display: flex; justify-content: space-between; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; } .job b { color: var(--lime); }
    .planner .foe { margin-bottom: 8px; font-size: 15px; } .planner .foe small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .slide { display: block; margin-bottom: 10px; font-size: 13px; } .slide span { display: block; margin-bottom: 4px; color: #cfe0c4; } .slide b { color: #fff; } .slide input[type=range] { width: 100%; accent-color: var(--lime); height: 32px; }
    .why { color: var(--red); font-size: 12px; margin-bottom: 8px; line-height: 1.5; } .planner .btn { width: 100%; }
    .battle-result p.small { font-size: 12px; color: var(--muted); margin-top: -6px; }
    @media (min-width: 900px) { .sbx-bar { top: 64px; } }
    #ui > .pickbanner { pointer-events: none; }
    .sbx-rail em[hidden] { display: none; }
    .btn.primary[disabled] { background: #26340f; border-color: #26340f; color: #7c8f6a; box-shadow: none; opacity: 1; }
    .res { flex-wrap: wrap; } .res .chip { padding: 4px 6px; min-width: 0; }
    @media (max-height: 500px) and (orientation: landscape) { .fab.legend { left: auto; right: 12px; } }
    .battle-result { max-height: 52vh; overflow-y: auto; touch-action: pan-y; } .battle-top .back.fast { min-width: 48px; margin-left: -4px; color: var(--lime); }
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="vignette"></div>
  <div id="ui"></div>
  <div id="boot"><img src="art/title/badlands.png" alt="Vyre Bad Lands" /><div class="meter"><i id="bootbar"></i></div><span id="bootmsg">loading</span></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
