# Vyre Bad Lands: Token Arena. The page is served from disk; the match server (Node, on 127.0.0.1:2567) is reached through the same address,
# so the page needs no server setting and works over http or https alike. setup.sh fills in __SERVER_NAME__ and __WEBROOT__.
limit_req_zone $binary_remote_addr zone=arena_api:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=arena_conn:10m;

map $http_upgrade $arena_connection { default upgrade; '' close; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    root __WEBROOT__;
    index index.html;
    client_max_body_size 4k;
    limit_conn arena_conn 300;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # joining a match, the shop, the health check and the list of open matches go to the match server
    location ~ ^/(matchmake|api)/ {
        limit_req zone=arena_api burst=200 nodelay;
        proxy_pass http://127.0.0.1:2567;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health { proxy_pass http://127.0.0.1:2567; }
    location = /rooms  { proxy_pass http://127.0.0.1:2567; }

    # the live connection to a match: /<server id>/<room id>, upgraded to a WebSocket
    location ~ "^/[A-Za-z0-9_-]{6,}/[A-Za-z0-9_-]{6,}$" {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arena_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # models, pictures, sounds and skies never change under the same name; the page and its scripts are checked every time
    location ~* \.(glb|webp|png|jpg|mp3|hdr|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
