<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<meta name="mobile-web-app-capable" content="yes" />

<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
  input, select, textarea { -webkit-user-select: text; user-select: text; }
  #game { position: fixed; inset: 0; height: 100vh; height: 100dvh; } #game canvas { display: block; width: 100%; height: 100%; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0d10; color: #b6ff00; font: 800 20px system-ui, sans-serif; letter-spacing: .08em; z-index: 9; }
  #boot small { display: block; color: #8a9a7e; font-weight: 600; font-size: 12px; margin-top: 8px; text-align: center; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="game"></div>
<div id="boot"><div><img src="/badlands-small.png" alt="Vyre Bad Lands" style="display:block;margin:0 auto 14px;width:min(220px,60vw)" /><small id="bootmsg">loading</small></div></div>
<script>
// if the game cannot start, say why on the loading screen, and how to open the page in a full browser
(function () {
  var msg = document.getElementById('bootmsg'), noGl = false;
  var again = '<br><br><a href="" onclick="location.reload();return false" style="display:inline-block;padding:10px 22px;border-radius:10px;background:#b6ff00;color:#0b0d10;font-weight:800;text-decoration:none;letter-spacing:.06em">TRY AGAIN</a>';
  var hint = again + '<br><br>Still stuck? Open this page in Safari or Chrome (in Telegram: tap the menu, then Open in Browser).';
  var lost = function (m) { return /could not load/.test(m) ? 'A file did not finish downloading (the connection dropped).' : 'Something went wrong while loading: ' + m; };
  function say(t) { if (msg && document.getElementById('boot')) msg.innerHTML = t; }
  try { if (!document.createElement('canvas').getContext('webgl2')) { noGl = true; say('This browser cannot run the game (it needs WebGL 2).' + hint); } } catch (e) { /* ignore */ }
  addEventListener('error', function (e) { say(lost(String(e.message || '').slice(0, 120)) + hint); });
  addEventListener('unhandledrejection', function (e) { say(lost(String((e.reason && e.reason.message) || e.reason || '').slice(0, 120)) + hint); });
  setTimeout(function () { if (!noGl) say((msg ? msg.textContent : 'loading') + '<br><br>Taking a while? The connection may be slow, or this browser is struggling.' + hint); }, 30000);
})();
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
