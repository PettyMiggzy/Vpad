<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matches running</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#050805;color:#e8f0e0;font:15px/1.4 system-ui,sans-serif;padding:18px;max-width:900px;margin-inline:auto}
h1{font-size:20px;margin:0 0 4px}.sub{color:#8a9a80;font-size:13px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:#0c130b;border:1px solid #243320;border-radius:12px;padding:10px 12px}.card b{display:block;font-size:22px;color:#b6ff00}.card span{font-size:12px;color:#8a9a80}
.warn b{color:#ff9a3c}.bad b{color:#ff5a4a}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:#8a9a80;font-weight:600;text-align:left;font-size:12px;padding:4px 6px}td{padding:6px;border-top:1px solid #1a2618}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:#17240f;color:#b6ff00;font-size:12px}
.empty{color:#8a9a80;padding:16px 0}
</style></head><body>
<h1>Matches running</h1><div class="sub">Updates every few seconds. No player names or ids are shown here.</div>
<div class="cards" id="cards"></div>
<table><thead><tr><th>Map</th><th>Type</th><th>Players</th><th>Score</th><th>State</th><th>Clock</th></tr></thead><tbody id="rows"></tbody></table>
<div class="empty" id="empty" hidden>No matches right now.</div>
<script>
const MAPS={cargo:'Cargo Yard',dust:'Dust Town',refinery:'Refinery'},TYPE={elim:'Elimination',zone:'Hold the Zone',dm:'Deathmatch'};
const clock=(s)=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const card=(v,l,c='')=>`<div class="card ${c}"><b>${v}</b><span>${l}</span></div>`;
async function tick(){
  try{
    const s=await (await fetch('/stats',{cache:'no-store'})).json();
    const full=s.rooms/s.maxRooms, lag=s.loopP99Ms;
    document.getElementById('cards').innerHTML=card(`${s.rooms} / ${s.maxRooms}`,'matches / the limit',full>0.9?'bad':full>0.75?'warn':'')+card(s.players,'people playing')+card(s.bots,'computer players')+card(`${Number(lag).toFixed(1)} ms`,'server clock delay (99th percentile; stutter starts near 15)',lag>15?'bad':lag>8?'warn':'')+card(`${s.memoryMB} MB`,'server memory');
    document.getElementById('rows').innerHTML=s.matches.map(m=>`<tr><td>${MAPS[m.map]||m.map}</td><td>${TYPE[m.objective]||'Elimination'}${m.objective==='dm'?` ${m.minutes} min`:''} <span class="tag">${m.mode}</span></td><td>${m.humans} + ${m.bots} bots</td><td>${m.score[0]} : ${m.score[1]}</td><td>${m.phase}</td><td>${m.objective==='dm'||m.phase==='live'?clock(m.timer):'-'}</td></tr>`).join('');
    document.getElementById('empty').hidden=s.matches.length>0;
  }catch{document.getElementById('cards').innerHTML=card('offline','the match server did not answer','bad')}
}
tick();setInterval(tick,3000);
</script></body></html>
